<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f4f8f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>영어 원리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>:root{--accent:#2f4f8f;--accent-soft:#e4eaf6}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#8fb0ee;--accent-soft:#1f2b45}}</style>
</head>
<body>
<div class="wrap">
  <button id="tocBtn" class="toc-btn" aria-expanded="false" aria-controls="toc">목차</button>
  <main id="content" tabindex="-1"></main>
</div>

<div id="tocBack" class="toc-back" hidden></div>
<nav id="toc" class="toc" aria-label="목차" hidden></nav>

<div id="player" class="player" hidden>
  <div class="p-top">
    <a id="pTitle" class="p-title" href="#">-</a>
    <span id="pCount" class="p-count">0 / 0</span>
  </div>
  <div id="pText" class="p-text">-</div>
  <div class="p-row">
    <div class="p-grp">
      <button id="bPrev" class="icon" aria-label="이전 문장" title="이전 문장">⏮</button>
      <button id="bPlay" class="icon big" aria-label="재생" title="재생 / 일시정지">▶</button>
      <button id="bNext" class="icon" aria-label="다음 문장" title="다음 문장 (마지막이면 다음 단계)">⏭</button>
    </div>
    <div class="p-grp">
      <button id="bFull" class="chip" title="전체 화면">⛶ 전체 화면</button>
      <button id="bMore" class="chip" aria-expanded="true" title="반복·속도 등 설정">설정 ▾</button>
    </div>
  </div>
  <div id="pMore" class="p-row p-more">
    <div class="p-grp" role="group" aria-label="반복">
      <span class="lab">문장 반복</span>
      <button id="rMinus" class="icon sm" aria-label="반복 횟수 줄이기">−</button>
      <span id="rVal" class="rval">1회</span>
      <button id="rPlus" class="icon sm" aria-label="반복 횟수 늘리기">+</button>
      <button id="rInf" class="chip" aria-pressed="false" title="무한 반복">∞</button>
    </div>
    <div class="p-grp" role="group" aria-label="속도">
      <button class="chip speed" data-rate="0.75" aria-pressed="false">느리게</button>
      <button class="chip speed" data-rate="1" aria-pressed="true">보통</button>
      <button class="chip speed" data-rate="1.3" aria-pressed="false">빠르게</button>
    </div>
    <div class="p-grp">
      <button id="bAuto" class="chip" aria-pressed="true" title="1→2→3단계, 다음 페이지로 자동으로 넘어가요">다음 단계 자동</button>
      <button id="bLoop" class="chip" aria-pressed="false" title="이 단계를 처음부터 다시">단계 반복</button>
      <button id="bSleep" class="chip" title="누를 때마다 15 · 30 · 60 · 90분 · 끔">⏲ 타이머 끔</button>
      <button id="bRestart" class="chip" title="처음부터">처음부터</button>
      <button id="bClose" class="chip" title="플레이어 닫기">닫기</button>
    </div>
  </div>
</div>

<div id="fs" class="fs" hidden>
  <div class="fs-meta"><span id="fsMeta"></span><span id="fsHint">두 번 탭(클릭)하면 닫혀요</span></div>
  <div class="fs-body"><div id="fsEn" class="fs-en"></div></div>
  <div class="fs-ctrl">
    <button id="fPrev" class="icon" aria-label="이전 문장">⏮</button>
    <button id="fPlay" class="icon big" aria-label="재생">▶</button>
    <button id="fNext" class="icon" aria-label="다음 문장">⏭</button>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
