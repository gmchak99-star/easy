<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영어회화 실전 평서문 1,000회 트레이너</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151e32;
      --card-border: #233554;
      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #38bdf8;
      --danger: #ef4444;
      --success: #10b981;

      /* 청크 컬러 테마 */
      --c-subj: #c084fc;   /* 연보라: 주어/시작구 */
      --c-verb: #4ade80;   /* 연초록: 핵심 구문 및 동사 */
      --c-obj: #38bdf8;    /* 하늘색: 목적어/보어 */
      --c-mod: #fbbf24;    /* 주황노랑: 전치사/수식어구 */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text-main);
      padding: 12px;
      padding-bottom: 95px;
      max-width: 760px;
      margin: 0 auto;
    }

    header { text-align: center; margin-bottom: 12px; }
    h1 { font-size: 1.35rem; font-weight: 800; color: #fff; margin-bottom: 4px; }
    p.desc { font-size: 0.8rem; color: var(--text-sub); }

    /* Web AudioContext 오디오 언락 & TTS 초기화 모듈 바 */
    .audio-unlock-bar {
      background: #1e3a8a;
      border: 1px solid #3b82f6;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .audio-unlock-bar span { font-size: 0.82rem; font-weight: 700; color: #bfdbfe; }
    .btn-unlock {
      background: #60a5fa;
      color: #0f172a;
      border: none;
      padding: 7px 12px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.82rem;
      cursor: pointer;
      white-space: nowrap;
    }

    /* [핵심] 스크롤 시 화면 상단에 영구 고정되는 컨트롤 바 */
    .sticky-controls {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid #3b82f6;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      border-radius: 10px;
      padding: 10px 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .ctrl-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .btn-pill {
      background: #1e293b;
      border: 1px solid #475569;
      color: #e2e8f0;
      padding: 7px 9px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-mode-toggle {
      background: #0d9488;
      border: 1px solid #14b8a6;
      color: #fff;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-shuffle {
      background: #7c3aed;
      color: #fff;
      border: none;
      padding: 7px 11px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .btn-seq {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 7px 11px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .btn-emergency-stop {
      background: var(--danger);
      color: #fff;
      border: none;
      padding: 7px 12px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.8rem;
      cursor: pointer;
    }

    /* 문장 카드 */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .pattern-title {
      font-size: 1.02rem;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 12px;
      border-bottom: 1px solid #334155;
      padding-bottom: 6px;
    }
    .sentence-block {
      background: #090d16;
      border: 1px solid #233554;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      transition: all 0.2s;
    }
    .sentence-block.playing {
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
    }
    .ko-box {
      font-size: 0.96rem;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    /* 청크 스타일 및 발화 하이라이트 */
    .en-box {
      background: #111827;
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 10px;
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.6;
      user-select: text;
    }
    .en-box.hidden .chunk {
      filter: blur(6px);
      user-select: none;
      opacity: 0.3;
    }
    .chunk {
      display: inline-block;
      margin-right: 4px;
      padding: 1px 4px;
      border-radius: 4px;
      transition: background 0.15s, transform 0.15s;
    }
    .chunk.active-spoken {
      background: rgba(255, 255, 255, 0.22);
      transform: scale(1.04);
      outline: 1px solid var(--accent);
    }
    .chunk-subj { color: var(--c-subj); }
    .chunk-verb { color: var(--c-verb); font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }
    .chunk-obj  { color: var(--c-obj); }
    .chunk-mod  { color: var(--c-mod); }

    .ctrl-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      justify-content: flex-end;
    }
    .btn {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 7px 11px;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .btn-ans { background: #334155; color: #fff; }
    .btn-mic { background: #0284c7; color: #fff; }
    .btn-play { background: var(--primary); color: #fff; }
    .btn-stop { background: #475569; color: #fff; }
    .status-badge {
      font-size: 0.82rem;
      color: var(--accent);
      font-weight: 800;
      min-width: 85px;
      text-align: right;
    }
    .stt-feedback {
      width: 100%;
      margin-top: 8px;
      font-size: 0.82rem;
      color: #facc15;
    }

    /* 플로팅 화면끄기 버튼 */
    .floating-bar { position: fixed; bottom: 18px; right: 18px; z-index: 999; }
    .btn-float-sleep {
      background: #090d16;
      color: var(--accent);
      border: 2px solid var(--accent);
      border-radius: 30px;
      padding: 10px 16px;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.6);
    }

    /* OLED 순수 블랙 오버레이 */
    #dark-curtain {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000000;
      z-index: 999999;
      color: #22c55e;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      user-select: none;
    }
    #dark-curtain .wake-hint {
      color: #334155;
      font-size: 0.82rem;
      margin-bottom: 24px;
    }
    #dark-curtain .curr-text {
      color: #64748b;
      font-size: 1.1rem;
      line-height: 1.5;
      margin-bottom: 12px;
      max-width: 90%;
    }
    #dark-curtain .curr-count {
      color: #1d4ed8;
      font-size: 1.7rem;
      font-weight: 800;
    }
  </style>
</head>
<body>

  <header>
    <h1>☕ 실전 평서문 1,000회 트레이너</h1>
    <p class="desc">색상 청크 어순 체화 | 상단 제어바 스크롤 고정 | 1,000회 무한 루프</p>
  </header>

  <!-- Web AudioContext 오디오 언락 & TTS 초기화 모듈 -->
  <div class="audio-unlock-bar">
    <span>🔊 깃허브 웹소리가 안 나면 먼저 눌러주세요:</span>
    <button class="btn-unlock" onclick="forceUnlockAudio()">스피커 강제 깨우기</button>
  </div>

  <!-- [스크롤 상단 고정] 제어 버튼 바 -->
  <div class="sticky-controls">
    <div class="ctrl-group">
      <button class="btn-pill" id="g-voice" onclick="toggleGlobalVoice()">👨 남성 음성</button>
      <button class="btn-pill" id="g-speed" onclick="toggleGlobalSpeed()">0.85x (기본)</button>
      <button class="btn-mode-toggle" id="g-reading-mode" onclick="toggleReadingMode()">🗣️ 낭독: 일반</button>
    </div>
    <div class="ctrl-group">
      <button class="btn-shuffle" onclick="shufflePatterns()">🔀 셔플</button>
      <button class="btn-seq" onclick="startAllSequential()">🔁 전체순차</button>
      <button class="btn-emergency-stop" onclick="globalStop()">⏹️ 정지</button>
    </div>
  </div>

  <div id="pattern-list"></div>

  <!-- 플로팅 화면 절전 버튼 -->
  <div class="floating-bar">
    <button class="btn-float-sleep" onclick="enableBlackout()">🌙 화면 절전 (암전)</button>
  </div>

  <!-- OLED 순수 블랙 오버레이 -->
  <div id="dark-curtain" onclick="handleTap()">
    <div class="wake-hint">💡 화면을 빠르게 톡! 톡! 두 번 두드리면 복귀합니다</div>
    <div class="curr-text" id="blackout-title">섀도잉 진행 중...</div>
    <div class="curr-count" id="blackout-counter">0 / 1000</div>
  </div>

  <script>
    /* ==========================================================================
       [모듈] Web AudioContext 오디오 언락 & TTS 초기화 모듈
       ========================================================================== */
    let audioCtx = null;
    let audioUnlocked = false;

    function forceUnlockAudio() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          if (!audioCtx) audioCtx = new AudioCtx();
          if (audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          gain.gain.value = 0.001;
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(0);
          osc.stop(0.05);
        }
      } catch (e) {
        console.warn("AudioContext bypass:", e);
      }

      window.speechSynthesis.cancel();
      window.speechSynthesis.resume();

      const testUtter = new SpeechSynthesisUtterance("Audio engine ready.");
      testUtter.lang = 'en-US';
      testUtter.rate = 1.0;
      testUtter.volume = 1.0;
      window.speechSynthesis.speak(testUtter);
      audioUnlocked = true;
      alert("🔊 브라우저 스피커가 강제 활성화되었습니다! 문장을 재생해보세요.");
    }

    function ensureAudioUnlocked() {
      if (!audioUnlocked) {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx && !audioCtx) audioCtx = new AudioCtx();
          if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        } catch(e) {}
      }
    }

    /* ==========================================================================
       원본 예문 100% 보존 데이터베이스 (문법 청크 구조화 매핑)
       ========================================================================== */
    const originalDataset = [
      {
        pattern: "1. I usually + 동사 (평소 습관·루틴)",
        sentences: [
          {
            en: "I usually work out at the gym after work.",
            ko: "퇴근하고 보통 헬스장에서 운동해요.",
            chunks: [
              { text: "I usually", type: "subj" },
              { text: "work out", type: "verb" },
              { text: "at the gym", type: "obj" },
              { text: "after work.", type: "mod" }
            ]
          },
          {
            en: "I usually listen to music to wind down in the evening.",
            ko: "저녁엔 긴장을 풀려고 주로 음악을 들어요.",
            chunks: [
              { text: "I usually", type: "subj" },
              { text: "listen to music", type: "verb" },
              { text: "to wind down", type: "obj" },
              { text: "in the evening.", type: "mod" }
            ]
          }
        ]
      },
      {
        pattern: "2. I think (that) ~ (내 생각·견해 표현)",
        sentences: [
          {
            en: "I think progressive overload is key to muscle growth.",
            ko: "근성장에는 점진적 과부하가 핵심이라고 생각해요.",
            chunks: [
              { text: "I think", type: "subj" },
              { text: "progressive overload", type: "verb" },
              { text: "is key", type: "obj" },
              { text: "to muscle growth.", type: "mod" }
            ]
          },
          {
            en: "I think speaking out loud is the best way to improve.",
            ko: "소리 내서 말해보는 게 실력 늘리는 데 최고인 것 같아요.",
            chunks: [
              { text: "I think", type: "subj" },
              { text: "speaking out loud", type: "verb" },
              { text: "is the best way", type: "obj" },
              { text: "to improve.", type: "mod" }
            ]
          }
        ]
      },
      {
        pattern: "3. I don't think (that) ~ (완곡한 반대·부정)",
        sentences: [
          {
            en: "I don't think this is going to work out well.",
            ko: "이 방식이 썩 잘 풀릴 것 같지는 않아요.",
            chunks: [
              { text: "I don't think", type: "subj" },
              { text: "this is going to", type: "verb" },
              { text: "work out", type: "obj" },
              { text: "well.", type: "mod" }
            ]
          },
          {
            en: "I don't think eating late snacks is good for my diet.",
            ko: "야식 먹는 건 식단 관리에 별로 안 좋은 것 같아요.",
            chunks: [
              { text: "I don't think", type: "subj" },
              { text: "eating late snacks", type: "verb" },
              { text: "is good", type: "obj" },
              { text: "for my diet.", type: "mod" }
            ]
          }
        ]
      },
      {
        pattern: "4. I'm interested in ~ (관심사·취미)",
        sentences: [
          {
            en: "I am interested in free diving and deep water training.",
            ko: "저는 프리다이빙이랑 잠수 훈련에 관심이 많아요.",
            chunks: [
              { text: "I am", type: "subj" },
              { text: "interested in", type: "verb" },
              { text: "free diving", type: "obj" },
              { text: "and deep water training.", type: "mod" }
            ]
          },
          {
            en: "I am really interested in learning spoken languages.",
            ko: "저는 회화 표현 배우는 것에 관심이 아주 많습니다.",
            chunks: [
              { text: "I am really", type: "subj" },
              { text: "interested in", type: "verb" },
              { text: "learning", type: "obj" },
              { text: "spoken languages.", type: "mod" }
            ]
          }
        ]
      },
      {
        pattern: "5. I prefer ~ (선호도 밝히기)",
        sentences: [
          {
            en: "I prefer drinking iced Americano even in winter.",
            ko: "저는 겨울에도 아이스 아메리카노 마시는 걸 선호해요.",
            chunks: [
              { text: "I prefer", type: "subj" },
              { text: "drinking", type: "verb" },
              { text: "iced Americano", type: "obj" },
              { text: "even in winter.", type: "mod" }
            ]
          },
          {
            en: "I prefer working out early rather than late at night.",
            ko: "밤늦게보다는 아침 일찍 운동하는 걸 더 좋아해요.",
            chunks: [
              { text: "I prefer", type: "subj" },
              { text: "working out early", type: "verb" },
              { text: "rather than", type: "obj" },
              { text: "late at night.", type: "mod" }
            ]
          }
        ]
      },
      {
        pattern: "6. I've been + ~ing (요즘 지속 중인 근황)",
        sentences: [
          {
            en: "I have been going to the gym four times a week.",
            ko: "요즘 일주일에 4번씩 꾸준히 운동하고 있어요.",
            chunks: [
              { text: "I have been", type: "subj" },
              { text: "going to the gym", type: "verb" },
              { text: "four times", type: "obj" },
              { text: "a week.", type: "mod" }
            ]
          },
          {
            en: "I have been practicing conversational English every single day.",
            ko: "매일 빠짐없이 영어 회화를 연습해오고 있습니다.",
            chunks: [
              { text: "I have been", type: "subj" },
              { text: "practicing", type: "verb" },
              { text: "conversational English", type: "obj" },
              { text: "every single day.", type: "mod" }
            ]
          }
        ]
      },
      {
        pattern: "7. It takes me + 시간 + to ~ (소요 시간 설명)",
        sentences: [
          {
            en: "It takes me about forty minutes to commute by subway.",
            ko: "지하철로 출퇴근하는 데 한 40분 정도 걸려요.",
            chunks: [
              { text: "It takes me", type: "subj" },
              { text: "about forty minutes", type: "verb" },
              { text: "to commute", type: "obj" },
              { text: "by subway.", type: "mod" }
            ]
          },
          {
            en: "It takes consistent effort to form a good habit.",
            ko: "좋은 습관을 들이는 데는 꾸준한 노력이 필요하죠.",
            chunks: [
              { text: "It takes", type: "subj" },
              { text: "consistent effort", type: "verb" },
              { text: "to form", type: "obj" },
              { text: "a good habit.", type: "mod" }
            ]
          }
        ]
      },
      {
        pattern: "8. I used to + 동사 (과거의 습관 vs 현재)",
        sentences: [
          {
            en: "I used to skip breakfast, but now I eat light meals.",
            ko: "예전엔 아침을 거르곤 했는데, 지금은 가볍게 챙겨 먹어요.",
            chunks: [
              { text: "I used to", type: "subj" },
              { text: "skip breakfast,", type: "verb" },
              { text: "but now I eat", type: "obj" },
              { text: "light meals.", type: "mod" }
            ]
          },
          {
            en: "I used to be shy, but I am getting comfortable.",
            ko: "예전엔 수줍음이 많았는데, 점점 편해지고 있어요.",
            chunks: [
              { text: "I used to", type: "subj" },
              { text: "be shy,", type: "verb" },
              { text: "but I am getting", type: "obj" },
              { text: "comfortable.", type: "mod" }
            ]
          }
        ]
      },
      {
        pattern: "9. I'm planning to + 동사 (앞으로의 계획)",
        sentences: [
          {
            en: "I am planning to practice speaking at an English cafe.",
            ko: "영어회화 카페에 가서 말하기 연습을 해볼 계획이에요.",
            chunks: [
              { text: "I am planning to", type: "subj" },
              { text: "practice speaking", type: "verb" },
              { text: "at an", type: "obj" },
              { text: "English cafe.", type: "mod" }
            ]
          },
          {
            en: "I am planning to go on a short road trip this weekend.",
            ko: "이번 주말에 짧게 로드 트립을 다녀올 계획입니다.",
            chunks: [
              { text: "I am planning to", type: "subj" },
              { text: "go on", type: "verb" },
              { text: "a short road trip", type: "obj" },
              { text: "this weekend.", type: "mod" }
            ]
          }
        ]
      },
      {
        pattern: "10. I'm trying to + 동사 (애쓰는 점)",
        sentences: [
          {
            en: "I am trying to speak English without worrying about mistakes.",
            ko: "실수 신경 쓰지 않고 영어로 내뱉어보려고 노력 중이에요.",
            chunks: [
              { text: "I am trying to", type: "subj" },
              { text: "speak English", type: "verb" },
              { text: "without worrying", type: "obj" },
              { text: "about mistakes.", type: "mod" }
            ]
          },
          {
            en: "I am trying to keep a strict high protein diet.",

            chunks: [

              { text: "consistent practice", type: "verb" },

      },
      {

            ko: "그렇기 때문에 오늘 이 모임에 참석하기로 결심했어요.",
            chunks: [
              { text: "That is why", type: "subj" },
              { text: "I decided to join", type: "verb" },
              { text: "this meetup", type: "obj" },
              { text: "today.", type: "mod" }
            ]
          },
          {

            ko: "그래서 저는 매일의 진행 상황을 항상 기록합니다.",
            chunks: [
              { text: "That is why", type: "subj" },
              { text: "I always track", type: "verb" },

      },

        sentences: [

            ko: "영어로 말하는 게 이렇게 재미있을 줄은 미처 몰랐어요.",
            chunks: [
              { text: "I didn't expect to", type: "subj" },
              { text: "enjoy speaking", type: "verb" },

          },
          {

            ko: "모임 분위기가 이렇게 편하고 좋을 줄은 몰랐네요.",
            chunks: [

      },
      {

        sentences: [

            ko: "이 세션 끝나고 시원한 아이스 커피 한잔 마시고 싶네요.",
            chunks: [
              { text: "I feel like", type: "subj" },
              { text: "grabbing", type: "verb" },
              { text: "an iced coffee", type: "obj" },
              { text: "after this session.", type: "mod" }
            ]
          },
          {
            en: "I feel like my speaking fluency is gradually improving.",
            ko: "제 말문이 조금씩 트이고 있는 기분이 듭니다.",
            chunks: [
              { text: "I feel like", type: "subj" },
              { text: "my speaking fluency", type: "verb" },
              { text: "is gradually", type: "obj" },
              { text: "improving.", type: "mod" }
            ]
          }
        ]
      },
      {
        pattern: "15. I'm getting used to ~ (점점 익숙해지는 과정)",
        sentences: [
          {
            en: "I am getting used to speaking in front of people.",
            ko: "사람들 앞에서 영어로 말하는 것에 점점 익숙해지고 있어요.",
            chunks: [
              { text: "I am getting used to", type: "subj" },
              { text: "speaking", type: "verb" },
              { text: "in front of", type: "obj" },
              { text: "people.", type: "mod" }
            ]
          },
          {
            en: "I am getting used to my new daily workout routine.",
            ko: "새로운 일일 운동 루틴에 점차 몸이 적응하고 있어요.",
            chunks: [
              { text: "I am getting used to", type: "subj" },
              { text: "my new daily", type: "verb" },
              { text: "workout", type: "obj" },
              { text: "routine.", type: "mod" }
            ]
          }
        ]
      },
      {
        pattern: "16. To be honest, ~ (솔직한 심정 밝히기)",
        sentences: [
          {
            en: "To be honest, I was a bit nervous at first.",
            ko: "솔직히 말씀드리면, 처음엔 살짝 긴장했었어요.",
            chunks: [
              { text: "To be honest,", type: "subj" },
              { text: "I was", type: "verb" },
              { text: "a bit nervous", type: "obj" },
              { text: "at first.", type: "mod" }
            ]
          },
          {
            en: "To be honest, making sentences on the spot is challenging.",
            ko: "솔직히 그 자리에서 바로 문장을 만드는 건 쉽지 않네요.",
            chunks: [
              { text: "To be honest,", type: "subj" },
              { text: "making sentences", type: "verb" },
              { text: "on the spot", type: "obj" },
              { text: "is challenging.", type: "mod" }
            ]
          }
        ]
      }
    ];

    let dataset = JSON.parse(JSON.stringify(originalDataset));
    const TARGET_REPEAT = 1000;
    let isStopped = false;
    let loopTimeout = null;
    let lastTapTime = 0;
    let currentVoiceGender = 'male';
    let currentRate = 0.85;
    let readingMode = 'normal'; // 'normal' (일반) vs 'chunk' (청크 끊어 읽기)

    function getSelectedVoice() {
      const voices = window.speechSynthesis.getVoices();
      if (!voices || voices.length === 0) return null;
      const usVoices = voices.filter(v => v.lang === 'en-US' || v.lang === 'en_US');
      const pool = usVoices.length > 0 ? usVoices : voices.filter(v => v.lang.startsWith('en'));

      if (currentVoiceGender === 'female') {
        return pool.find(v => /female|zira|jenny|samantha|susan|victoria/i.test(v.name)) || pool[0];
      } else {
        return pool.find(v => /male|david|guy|george/i.test(v.name)) || pool.find(v => !/female|zira|jenny/i.test(v.name)) || pool[0];
      }
    }
    window.speechSynthesis.onvoiceschanged = () => { getSelectedVoice(); };

    function sanitizeForSpeech(text) {
      return text.replace(/freediving/gi, "free diving")
                 .replace(/Freediving/gi, "Free diving")
                 .replace(/low-carb/gi, "low carb");
    }

    /* ==========================================================================
       낭독 엔진 (일반 모드 vs 청크 분절 모드)
       ========================================================================== */
    function toggleReadingMode() {
      const btn = document.getElementById('g-reading-mode');
      if (readingMode === 'normal') {
        readingMode = 'chunk';
        btn.innerText = "✂️ 낭독: 청크";
        btn.style.background = "#0284c7";
        btn.style.borderColor = "#38bdf8";
      } else {
        readingMode = 'normal';
        btn.innerText = "🗣️ 낭독: 일반";
        btn.style.background = "#0d9488";
        btn.style.borderColor = "#14b8a6";
      }
    }

    function toggleGlobalVoice() {
      const btn = document.getElementById('g-voice');
      if (currentVoiceGender === 'male') {
        currentVoiceGender = 'female';
        btn.innerText = "👩 여성 음성";
      } else {
        currentVoiceGender = 'male';
        btn.innerText = "👨 남성 음성";
      }
    }

    function toggleGlobalSpeed() {
      const btn = document.getElementById('g-speed');
      if (currentRate === 0.85) {
        currentRate = 1.0;
        btn.innerText = "1.0x (표준)";
      } else if (currentRate === 1.0) {
        currentRate = 1.25;
        btn.innerText = "1.25x (빠름)";
      } else if (currentRate === 1.25) {
        currentRate = 0.75;
        btn.innerText = "0.75x (느림)";
      } else {
        currentRate = 0.85;
        btn.innerText = "0.85x (기본)";
      }
    }

    function speakAdaptive(sObj, blockId, onComplete) {
      if (readingMode === 'normal') {
        clearChunkHighlight(blockId);
        window.speechSynthesis.cancel();
        window.speechSynthesis.resume();

        const u = new SpeechSynthesisUtterance(sanitizeForSpeech(sObj.en));
        u.lang = 'en-US';
        u.rate = currentRate;
        u.volume = 1.0;
        u.pitch = 1.0;

        const v = getSelectedVoice();
        if (v) u.voice = v;
        window._activeUtterance = u;

        u.onend = () => { if (!isStopped && onComplete) onComplete(); };
        u.onerror = () => { if (!isStopped && onComplete) onComplete(); };
        window.speechSynthesis.speak(u);
      } else {
        let chunkIdx = 0;
        function speakNextChunk() {
          if (isStopped) return;
          if (chunkIdx >= sObj.chunks.length) {
            clearChunkHighlight(blockId);
            if (onComplete) onComplete();
            return;
          }

          highlightActiveChunk(blockId, chunkIdx);
          window.speechSynthesis.cancel();
          window.speechSynthesis.resume();

          const chunk = sObj.chunks[chunkIdx];
          const u = new SpeechSynthesisUtterance(sanitizeForSpeech(chunk.text));
          u.lang = 'en-US';
          u.rate = currentRate;
          u.volume = 1.0;
          u.pitch = 1.0;

          const v = getSelectedVoice();
          if (v) u.voice = v;
          window._activeUtterance = u;

          u.onend = () => {
            if (isStopped) return;
            chunkIdx++;
            loopTimeout = setTimeout(speakNextChunk, 280);
          };
          u.onerror = () => {
            if (isStopped) return;
            chunkIdx++;
            loopTimeout = setTimeout(speakNextChunk, 200);
          };

          window.speechSynthesis.speak(u);
        }
        speakNextChunk();
      }
    }

    function highlightActiveChunk(blockId, chunkIdx) {
      clearChunkHighlight(blockId);
      const span = document.getElementById(`ck_${blockId}_${chunkIdx}`);
      if (span) span.classList.add('active-spoken');
    }

    function clearChunkHighlight(blockId) {
      const block = document.getElementById(blockId);
      if (block) {
        block.querySelectorAll('.chunk').forEach(el => el.classList.remove('active-spoken'));
      }
    }

    function setupMediaSession(titleText, count) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: `[${count}/1000] ${titleText}`,
          artist: '실전 평서문 16패턴',
          album: 'English Shadowing'
        });
      }
    }

    /* ==========================================================================
       1,000회 단일 루프 & 전체 순차 루프
       ========================================================================== */
    function start1000Loop(sObj, blockId, sid) {
      ensureAudioUnlocked();
      globalStop();
      isStopped = false;

      document.querySelectorAll('.sentence-block').forEach(b => b.classList.remove('playing'));
      const activeBlock = document.getElementById(blockId);
      if (activeBlock) activeBlock.classList.add('playing');

      let count = 0;
      const status = document.getElementById(sid);
      document.getElementById('blackout-title').innerText = sObj.en;

      function loop() {
        if (isStopped || count >= TARGET_REPEAT) {
          if (!isStopped) {
            status.innerText = "1,000회 완료";
            document.getElementById('blackout-counter').innerText = "완료";
          }
          return;
        }

        count++;
        status.innerText = `${count} / ${TARGET_REPEAT}`;
        document.getElementById('blackout-counter').innerText = `${count} / ${TARGET_REPEAT}`;
        setupMediaSession(sObj.en, count);

        speakAdaptive(sObj, blockId, () => {
          if (!isStopped && count < TARGET_REPEAT) {
            const gap = (readingMode === 'normal') ? 700 : 850;
            loopTimeout = setTimeout(loop, gap);
          } else if (count >= TARGET_REPEAT) {
            status.innerText = "1,000회 완료";
            document.getElementById('blackout-counter').innerText = "완료";
          }
        });
      }

      loop();
    }

    function startAllSequential() {
      ensureAudioUnlocked();
      globalStop();
      isStopped = false;

      const flatList = [];
      dataset.forEach((p, pIdx) => {
        p.sentences.forEach((s, sIdx) => {
          flatList.push({
            sObj: s,
            blockId: `blk_${pIdx}_${sIdx}`,
            sid: `st_${pIdx}_${sIdx}`
          });
        });
      });

      if (flatList.length === 0) return;
      let currentIdx = 0;

      function playNext() {
        if (isStopped) return;
        if (currentIdx >= flatList.length) currentIdx = 0;

        const item = flatList[currentIdx];
        document.querySelectorAll('.sentence-block').forEach(b => b.classList.remove('playing'));
        const activeBlock = document.getElementById(item.blockId);
        if (activeBlock) activeBlock.classList.add('playing');

        const status = document.getElementById(item.sid);
        status.innerText = "순환 중...";

        document.getElementById('blackout-title').innerText = `[${currentIdx + 1}/${flatList.length}] ${item.sObj.en}`;
        document.getElementById('blackout-counter').innerText = `문장 ${currentIdx + 1}`;
        setupMediaSession(item.sObj.en, currentIdx + 1);

        speakAdaptive(item.sObj, item.blockId, () => {
          if (!isStopped) {
            currentIdx++;
            loopTimeout = setTimeout(playNext, 850);
          }
        });
      }

      playNext();
    }

    function globalStop() {
      isStopped = true;
      clearTimeout(loopTimeout);
      window.speechSynthesis.cancel();
      document.querySelectorAll('.sentence-block').forEach(b => b.classList.remove('playing'));
      document.querySelectorAll('.status-badge').forEach(b => {
        if (b.innerText.includes('/') || b.innerText.includes('순환')) b.innerText = "정지됨";
      });
      document.querySelectorAll('.chunk').forEach(el => el.classList.remove('active-spoken'));
      document.getElementById('blackout-counter').innerText = "정지됨";
    }

    function shufflePatterns() {
      globalStop();
      for (let i = dataset.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [dataset[i], dataset[j]] = [dataset[j], dataset[i]];
      }
      renderUI();
    }

    function toggleAnswer(eid, btn) {
      const el = document.getElementById(eid);
      if (el.classList.contains('hidden')) {
        el.classList.remove('hidden');
        btn.innerText = "🙈 가리기";
      } else {
        el.classList.add('hidden');
        btn.innerText = "👁️ 정답 확인";
      }
    }

    /* 마이크 STT 발음 평가 */
    function practiceSpeech(targetText, fbid) {
      globalStop();
      const fb = document.getElementById(fbid);
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        fb.innerText = "⚠️ 브라우저가 음성 인식을 지원하지 않습니다. (크롬/삼성인터넷 권장)";
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = false;
      fb.innerText = "🎙️ 듣고 있습니다... 영어로 말해보세요!";

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        const cleanRec = transcript.toLowerCase().replace(/[^a-z0-9 ]/g, '').trim();
        const cleanTarget = targetText.toLowerCase().replace(/[^a-z0-9 ]/g, '').trim();

        if (cleanRec === cleanTarget) {
          fb.innerHTML = `✅ 완벽합니다! 인식: "${transcript}"`;
          fb.style.color = "#34d399";
        } else {
          fb.innerHTML = `🗣️ 인식: "${transcript}" (재도전!)`;
          fb.style.color = "#f59e0b";
        }
      };

      recognition.onerror = function(event) {
        fb.innerText = "⚠️ 음성 인식 오류: " + event.error;
      };

      recognition.start();
    }

    /* OLED 절전 암전 커튼 */
    function enableBlackout() {
      document.getElementById('dark-curtain').style.display = 'flex';
      if ('wakeLock' in navigator) {
        navigator.wakeLock.request('screen').catch(() => {});
      }
    }

    function handleTap() {
      const now = new Date().getTime();
      if (now - lastTapTime < 350) {
        document.getElementById('dark-curtain').style.display = 'none';
      }
      lastTapTime = now;
    }

    /* 화면 렌더링 */
    function renderUI() {
      const container = document.getElementById('pattern-list');
      container.innerHTML = "";

      dataset.forEach((p, pIdx) => {
        const card = document.createElement('div');
        card.className = 'card';
        let html = `<div class="pattern-title">${p.pattern}</div>`;

        p.sentences.forEach((s, sIdx) => {
          const blockId = `blk_${pIdx}_${sIdx}`;
          const eid = `en_${pIdx}_${sIdx}`;
          const sid = `st_${pIdx}_${sIdx}`;
          const fbid = `fb_${pIdx}_${sIdx}`;
          const cleanEn = s.en.replace(/'/g, "\\'");

          // 청크 HTML 빌드
          const chunksHtml = s.chunks.map((c, cIdx) => {
            return `<span class="chunk chunk-${c.type}" id="ck_${blockId}_${cIdx}">${c.text}</span>`;
          }).join(' ');

          html += `
            <div class="sentence-block" id="${blockId}">
              <div class="ko-box">🇰🇷 ${s.ko}</div>
              <div class="en-box hidden" id="${eid}">
                ${chunksHtml}
              </div>

              <div class="ctrl-wrap">
                <button class="btn btn-ans" onclick="toggleAnswer('${eid}', this)">👁️ 정답 확인</button>
                <button class="btn btn-mic" onclick="practiceSpeech('${cleanEn}', '${fbid}')">🎙️ 발음</button>
                <button class="btn btn-play" onclick="start1000Loop(dataset[${pIdx}].sentences[${sIdx}], '${blockId}', '${sid}')">▶ 1000회</button>
                <button class="btn btn-stop" onclick="globalStop()">정지</button>
                <span class="status-badge" id="${sid}"></span>
                <div class="stt-feedback" id="${fbid}"></div>
              </div>
            </div>
          `;
        });

        card.innerHTML = html;
        container.appendChild(card);
      });
    }

    renderUI();
  </script>
